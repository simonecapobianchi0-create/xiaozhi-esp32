name: Ugo firmware PDM
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.3
    steps:
      - name: Get xiaozhi v2.5.0
        run: git clone --depth 1 --branch v2.5.0 https://github.com/78/xiaozhi-esp32.git src
      - name: Apply PDM microphone fix
        working-directory: src
        run: |
          grep -n "NoAudioCodecSimplexPdm" -r main/audio | head
          python3 - <<'PY'
          import re
          p='main/boards/otto-robot/config.h'
          s=open(p).read()
          s,n=re.subn(r'\.audio_i2s_mic_gpio_ws\s*=\s*GPIO_NUM_4,','.audio_i2s_mic_gpio_ws = GPIO_NUM_NC,',s)
          print('config.h replacements',n); assert n>=1
          open(p,'w').write(s)
          p='main/boards/otto-robot/otto_robot.cc'
          s=open(p).read()
          s,n1=re.subn(r'new NoAudioCodecSimplex\(','new NoAudioCodecSimplexPdm(',s)
          s,n2=re.subn(r'hw_config_\.audio_i2s_mic_gpio_ws,\s*','',s)
          print('cc replacements',n1,n2); assert n1==1 and n2==1
          open(p,'w').write(s)
          PY
          git diff
      - name: Apply display fix
        working-directory: src
        run: |
          python3 - <<'PY'
          import re
          p='main/boards/otto-robot/otto_robot.cc'
          s=open(p).read()
          assert 'io_config.pclk_hz = 40 * 1000 * 1000;' in s
          s=s.replace('io_config.pclk_hz = 40 * 1000 * 1000;','io_config.pclk_hz = 20 * 1000 * 1000;')
          s,n=re.subn(r'esp_lcd_panel_reset\(panel\);','vTaskDelay(pdMS_TO_TICKS(300));\n    esp_lcd_panel_reset(panel);\n    vTaskDelay(pdMS_TO_TICKS(150));\n    esp_lcd_panel_reset(panel);\n    vTaskDelay(pdMS_TO_TICKS(150));',s,count=1)
          print('reset replacements',n); assert n==1
          open(p,'w').write(s)
          PY
          git diff main/boards/otto-robot/otto_robot.cc
      - name: Build
        working-directory: src
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py otto-robot
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ugo-otto-2.5.0-lcd
          path: src/build/merged-binary.bin
          if-no-files-found: error
